name: Refresh settings data
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: tools/fetch_sources.sh master
      - run: node test/run.mjs
      - name: Open a pull request if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- data/schema.json && exit 0
          branch="refresh-schema-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Refresh settings data from ClickHouse master"
          git push -u origin "$branch"
          gh pr create --fill --base "${{ github.event.repository.default_branch }}"
