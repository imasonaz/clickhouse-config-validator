name: CI
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - uses: astral-sh/ruff-action@v3
        with:
          src: tools
      - run: ruff format --check tools
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/run.mjs
      - name: Example configs pass the checker
        run: node bin/ch-config-check.mjs --format github test/fixtures/config.xml test/fixtures/keeper_config.xml
      - name: The action itself
        uses: ./
        with:
          path: test/fixtures/config.xml test/fixtures/keeper_config.xml
          upgrade: 25.8:latest
